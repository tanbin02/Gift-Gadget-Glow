<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6d28d9">
  <script src="js/theme.js"></script>
  <title>Gift-Gadget-Glow · Invoice &amp; Stock</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
  <script src="js/qrcode.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js" defer></script>
</head>
<body>

<!-- PIN lock -->
<div id="lock" class="lock" hidden>
  <form id="lock-form" class="lock-card">
    <div class="logo big">G</div>
    <h1>Gift-Gadget-Glow</h1>
    <p>Invoice &amp; Stock Manager</p>
    <input id="pin-input" type="password" inputmode="numeric" autocomplete="current-password" placeholder="PIN দিন" required>
    <div id="lock-err" class="lock-err"></div>
    <button class="btn primary lg" type="submit">ঢুকুন</button>
  </form>
</div>

<header class="topbar">
  <div class="brand">
    <div class="logo" id="brand-logo">G</div>
    <div class="brand-text"><b id="brand-name">Gift-Gadget-Glow</b><small>Invoice &amp; Stock</small></div>
  </div>
  <nav class="tabs" id="tabs">
    <button data-tab="invoice" class="on"><i>🧾</i><span>Invoice</span></button>
    <button data-tab="stock"><i>📦</i><span>Stock</span></button>
    <button data-tab="orders"><i>📋</i><span>Orders</span></button>
  </nav>
  <div class="top-actions">
    <span id="sync" class="sync">●</span>
    <button class="icon-btn" id="btn-refresh" title="Refresh">⟳</button>
    <button class="icon-btn" id="btn-settings" title="Settings (theme, Excel)" aria-label="Settings">⚙</button>
    <button class="icon-btn" id="btn-lock" title="Lock">🔒</button>
  </div>
</header>

<div id="setup-banner" class="banner" hidden>
  ⚙️ <b>Setup বাকি আছে:</b> <code>js/config.js</code> ফাইলে <code>API_URL</code> বসাতে হবে। SETUP-GUIDE.md তে ধাপগুলো দেওয়া আছে।
</div>

<main>
  <!-- ============ INVOICE ============ -->
  <section id="tab-invoice" class="tab on">
    <div class="inv-layout">
      <div class="col-form">

        <div class="card">
          <h3><span class="step">1</span> Customer</h3>
          <div class="row2">
            <label class="field">নাম<input id="c-name" autocomplete="off" placeholder="Customer এর নাম"></label>
            <label class="field">মোবাইল নম্বর<input id="c-phone" inputmode="tel" autocomplete="off" placeholder="01XXXXXXXXX"></label>
          </div>
          <label class="field">ঠিকানা<textarea id="c-address" rows="2" placeholder="বাসা/রোড, এলাকা, থানা, জেলা"></textarea></label>
        </div>

        <div class="card">
          <h3><span class="step">2</span> Product বাছুন</h3>
          <div class="search"><input id="p-search" type="search" placeholder="নাম বা SKU দিয়ে খুঁজুন…" autocomplete="off"></div>
          <div id="p-chips" class="chips"></div>
          <div id="p-grid" class="pgrid"></div>
        </div>

        <div class="card">
          <h3><span class="step">3</span> Cart ও Charge</h3>
          <div id="cart"></div>
          <div class="row3">
            <label class="field">Delivery charge
              <input id="delivery" inputmode="decimal" value="0">
              <div id="delivery-presets" class="presets"></div>
            </label>
            <label class="field">Discount<input id="discount" inputmode="decimal" value="0"></label>
            <label class="field">Payment
              <select id="payment">
                <option>COD</option><option>bKash</option><option>Nagad</option><option>Rocket</option><option>Bank</option><option>Paid</option><option>Due</option>
              </select>
            </label>
          </div>
          <label class="field">Note (ঐচ্ছিক)<input id="note" autocomplete="off" placeholder="যেমন: Gift wrap করে দিবেন"></label>
        </div>
      </div>

      <aside class="col-preview">
        <div class="card sticky">
          <div class="preview-head">
            <h3>Invoice preview</h3>
            <button class="btn ghost sm" id="btn-clear">Clear</button>
          </div>
          <div class="inv-wrap"><div id="inv-preview"></div></div>
          <button id="btn-create" class="btn primary lg block">✓ Invoice তৈরি করুন</button>
          <p class="hint">তৈরি করলে stock নিজে থেকেই কমে যাবে।</p>
        </div>
      </aside>
    </div>
  </section>

  <!-- ============ STOCK ============ -->
  <section id="tab-stock" class="tab">
    <div class="fin" id="stock-stats"></div>
    <div class="card">
      <div class="toolbar">
        <div class="search grow"><input id="s-search" type="search" placeholder="নাম বা SKU খুঁজুন…" autocomplete="off"></div>
        <button id="btn-add-sku" class="btn primary">＋ নতুন SKU</button>
        <button id="btn-add-combo" class="btn">＋ Combo</button>
        <button id="btn-cats" class="btn" title="Category এর নাম, icon, prefix বদলান">⚙ Category</button>
      </div>
      <div id="s-chips" class="chips"></div>
      <div id="s-table" class="tbl-wrap"></div>
    </div>
  </section>

  <!-- ============ ORDERS ============ -->
  <section id="tab-orders" class="tab">
    <div class="stats" id="order-stats"></div>
    <div class="card">
      <div class="toolbar">
        <div class="search grow"><input id="o-search" type="search" placeholder="Invoice নম্বর, নাম বা মোবাইল…" autocomplete="off"></div>
      </div>
      <div class="chips" id="o-chips"></div>
      <div class="bulkbar" id="o-bulk" hidden></div>
      <div id="o-table" class="tbl-wrap"></div>
    </div>
  </section>
</main>

<div id="modal-root" class="modal-root"></div>
<div id="toasts" class="toasts"></div>

</body>
</html>
